<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퍼센트 시계</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-controls">
            <select id="languageSelector">
                <option value="en" data-i18n-key="languageEN">English</option>
                <option value="ko" data-i18n-key="languageKO">Korean</option>
                <option value="ja" data-i18n-key="languageJA">Japanese</option>
                <option value="cn" data-i18n-key="languageCN">Chinese</option>
            </select>
        </div>
        <h1 data-i18n-key="title">Daily Progress</h1>
        <div class="settings">
            <div class="time-picker-container">
                <label data-i18n-key="wakeUpLabel">Wake-up Time:</label>
                <div class="time-picker" id="wakeUpPicker">
                    <!-- Options will be populated by script.js -->
                </div>
                <label data-i18n-key="sleepLabel">Sleep Time:</label>
                <div class="time-picker" id="sleepPicker">
                    <!-- Options will be populated by script.js -->
                </div>
            </div>
            <div class="options">
                <div class="option-group">
                    <span data-i18n-key="graphTypeLabel">Graph Type:</span>
                    <input type="radio" id="bar" name="graphType" value="bar" checked>
                    <label for="bar" data-i18n-key="barLabel">Bar</label>
                    <input type="radio" id="circle" name="graphType" value="circle">
                    <label for="circle" data-i18n-key="circleLabel">Circle</label>
                </div>
                <div class="option-group">
                    <span data-i18n-key="colorLabel">Color:</span>
                    <input type="radio" id="green" name="color" value="#4caf50" checked>
                    <label for="green" data-i18n-key="greenLabel">Green</label>
                    <input type="radio" id="red" name="color" value="#f44336">
                    <label for="red" data-i18n-key="redLabel">Red</label>
                    <input type="radio" id="blue" name="color" value="#2196f3">
                    <label for="blue" data-i18n-key="blueLabel">Blue</label>
                </div>
            </div>
            <div class="button-container">
                <button id="setButton" data-i18n-key="setButton">Set</button>
                <button id="updateButton" data-i18n-key="updateButton">Check for Updates</button>
            </div>
        </div>
        <div id="update-info" class="update-info"></div>
        <div class="progress-container" id="bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p id="barPercentage" class="percentage-text">0%</p>
        <div class="circle-container" id="circle-container" style="display: none;">
            <p id="circlePercentage" class="percentage-text">0%</p>
            <svg width="200" height="200" viewBox="0 0 200 200">
                <circle class="circle-bg" cx="100" cy="100" r="90"></circle>
                <circle class="circle-progress" id="circleProgress" cx="100" cy="100" r="90"></circle>
            </svg>
        </div>
        <div class="quote-section">
            <div id="quote-container">
                <p id="quote-text"></p>
                <p id="quote-author"></p>
            </div>
        </div>
    </div>
    <script src="languages.js"></script>
    <script src="quotes.js"></script>
    <script src="script.js"></script>
</body>
</html>
